version: 1
profile: data
source_dirs:
  - src/
generated_dirs:
  - dist/
commands:
  build: <build-command>
  lint: <lint-command>
  test: <test-command>
  check: <check-command>

# ---- 启动命令（可选；工程有启动入口时取消注释并填真实命令）----
# 约定：启动脚本放 source_dirs 指向的源码区（如 src/、bin/、dags/），
#       命令登记在此处后，AI 通过 aios.config.yaml 即可发现并调用
#       （cli/lib/config.py 保留 commands 额外键，不限于 build/lint/test/check）。
# commands:
#   start: <启动命令，如调度/流水线入口（airflow / cron / python -m pipeline）>

# ---- SDD 扩展字段（仅当任务命中 aios/execution/sdd-workflow.md 场景 A' 时需要，取消注释并按需修改）----
# project:
#   kind: tool-software
# spec:
#   type: docs
# docs:
#   domains: docs/domains/         # 功能规格（pipeline/表结构/口径定义）
#   flows: docs/flows/             # 处理流程（调度、依赖顺序）
#   design: docs/design/           # 设计文档（架构，如有）
