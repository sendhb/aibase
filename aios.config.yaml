version: 1
profile: framework-self
# 这份 config.yaml 描述的是 aibase 这个仓库自己（框架的自举/dogfood 用例）——
# 下游项目应该从 profiles/<type>/config.template.yaml 复制一份改成自己的。
source_dirs:
  - kit/cli/
  - kit/aios/
  - kit/agents/
  - kit/profiles/
  - kit/knowledge/
  - kit/tools/
  - kit/docs/
  - runtime/
generated_dirs:
  - kit/cli/__pycache__/
  - kit/tests/__pycache__/
commands:
  build: "true"
  lint: "true"
  test: "python -m unittest discover -s kit/tests || python3 -m unittest discover -s kit/tests"
  check: "bash kit/cli/check"
